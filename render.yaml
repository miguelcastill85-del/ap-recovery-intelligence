services:
  - type: web
    name: ap-recovery-intelligence
    runtime: static
    repo: https://github.com/miguelcastill85-del/ap-recovery-intelligence
    branch: main
    buildCommand: echo "static site - no build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=3600, must-revalidate"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
